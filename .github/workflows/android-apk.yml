# Builds the Sali VPN Android APK on GitHub and publishes it as a download:
#   https://github.com/MaxDev595/Sali-VPN/releases/download/apk-latest/sali-vpn.apk
# Runs on every push to main that touches the mobile app, or manually (Actions → Android APK → Run workflow).
# Set the API address in Settings → Secrets and variables → Actions → Variables: EXPO_PUBLIC_API_URL.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/types/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        run: |
          npm install --no-audit --no-fund
          npm run build --workspace=packages/types
          # android/app/build.gradle expects expo-router next to the app
          if [ ! -e apps/mobile/node_modules/expo-router ]; then
            mkdir -p apps/mobile/node_modules
            ln -s ../../../node_modules/expo-router apps/mobile/node_modules/expo-router
          fi

      - name: App config
        run: |
          {
            echo "EXPO_PUBLIC_API_URL=${{ vars.EXPO_PUBLIC_API_URL || 'https://salivpn.com' }}"
            echo "EXPO_PUBLIC_LANDING_URL=https://salivpn.com"
            echo "EXPO_PUBLIC_BOT_USERNAME=${{ vars.EXPO_PUBLIC_BOT_USERNAME || 'SaliVPNOfficialBot' }}"
          } > apps/mobile/.env

      - name: Build release APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/sali-vpn.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: sali-vpn-apk
          path: sali-vpn.apk

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Sali VPN — последний APK
          body: Собрано автоматически из ${{ github.sha }}.
          prerelease: true
          files: sali-vpn.apk
