# Builds the Sali VPN Android APK on GitHub and publishes it as a download:
#   https://github.com/MaxDev595/Sali-VPN/releases/download/apk-latest/sali-vpn.apk
# Runs on every push to main that touches the mobile app, or manually (Actions → Android APK → Run workflow).
# Set the API address in Settings → Secrets and variables → Actions → Variables: EXPO_PUBLIC_API_URL.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/types/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        run: |
          npm ci --no-audit --no-fund
          npm run build --workspace=packages/types

      - name: App config
        run: |
          {
            echo "EXPO_PUBLIC_API_URL=${{ vars.EXPO_PUBLIC_API_URL || 'https://api.salivpn.com' }}"
            echo "EXPO_PUBLIC_LANDING_URL=https://salivpn.com"
            echo "EXPO_PUBLIC_BOT_USERNAME=${{ vars.EXPO_PUBLIC_BOT_USERNAME || 'SaliVPNOfficialBot' }}"
          } > apps/mobile/.env

      # Expo CLI is hoisted to the root node_modules but expo itself lives in
      # apps/mobile/node_modules, so Gradle's bundle task can't resolve it.
      # Bundle here (same as the local Windows release flow) and let Gradle skip it.
      - name: Bundle JS and compile Hermes bytecode
        working-directory: apps/mobile
        run: |
          OUT="$RUNNER_TEMP/rnbundle"
          mkdir -p "$OUT/assets" "$OUT/res"
          echo "SALI_PREBUILT_BUNDLE=$OUT" >> "$GITHUB_ENV"
          NODE_PATH="$PWD/node_modules" node node_modules/expo/bin/cli export:embed \
            --platform android --dev false --reset-cache \
            --entry-file "$PWD/node_modules/expo-router/entry.js" \
            --bundle-output "$RUNNER_TEMP/index.android.js" \
            --assets-dest "$OUT/res"
          RN="$(node -p "require('path').dirname(require.resolve('react-native/package.json'))")"
          "$RN/sdks/hermesc/linux64-bin/hermesc" -emit-binary -O -max-diagnostic-width=80 \
            -out "$OUT/assets/index.android.bundle" "$RUNNER_TEMP/index.android.js"
          ls -la "$OUT/assets"

      # The release key lives only in repository secrets (made by scripts/make-release-key.cmd).
      # Without it the build stops: release APKs are never signed with the public debug key.
      - name: Release signing key
        env:
          SALI_KEYSTORE_BASE64: ${{ secrets.SALI_KEYSTORE_BASE64 }}
          SALI_KEYSTORE_PASSWORD: ${{ secrets.SALI_KEYSTORE_PASSWORD }}
          SALI_KEY_ALIAS: ${{ secrets.SALI_KEY_ALIAS }}
        run: |
          if [ -z "$SALI_KEYSTORE_BASE64" ] || [ -z "$SALI_KEYSTORE_PASSWORD" ]; then
            echo "::error::Add SALI_KEYSTORE_BASE64, SALI_KEYSTORE_PASSWORD and SALI_KEY_ALIAS to repository secrets (scripts/make-release-key.cmd)."
            exit 1
          fi
          KS="$RUNNER_TEMP/sali-release.jks"
          echo "$SALI_KEYSTORE_BASE64" | base64 -d > "$KS"
          {
            echo "SALI_KEYSTORE_FILE=$KS"
            echo "SALI_KEYSTORE_PASSWORD=$SALI_KEYSTORE_PASSWORD"
            echo "SALI_KEY_ALIAS=${SALI_KEY_ALIAS:-sali}"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon \
            -I "$GITHUB_WORKSPACE/scripts/use-prebuilt-mobile-bundle.gradle"
          ls -la app/build/outputs/apk/release/
          APK=app/build/outputs/apk/release/app-arm64-v8a-release.apk
          [ -f "$APK" ] || APK="$(find app/build/outputs/apk/release -name '*.apk' | sort | head -n1)"
          unzip -l "$APK" | grep -q "assets/index.android.bundle" || { echo "JS bundle missing from APK"; exit 1; }
          cp "$APK" "$GITHUB_WORKSPACE/sali-vpn.apk"
          # Refuse to publish an APK signed with anything but the Sali key.
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)"
          "$APKSIGNER" verify --print-certs "$GITHUB_WORKSPACE/sali-vpn.apk" | tee "$RUNNER_TEMP/certs.txt"
          if grep -q "CN=Android Debug" "$RUNNER_TEMP/certs.txt"; then echo "::error::APK is signed with the debug key"; exit 1; fi
          grep "SHA-256" "$RUNNER_TEMP/certs.txt" | head -n1 | sed 's/.*: //' > "$GITHUB_WORKSPACE/sali-vpn.apk.cert-sha256.txt"
          sha256sum "$GITHUB_WORKSPACE/sali-vpn.apk" | cut -d' ' -f1 > "$GITHUB_WORKSPACE/sali-vpn.apk.sha256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: sali-vpn-apk
          path: sali-vpn.apk

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Sali VPN — последний APK
          body: |
            Собрано автоматически из ${{ github.sha }}.
            Подпись: ключ Sali VPN (отпечаток сертификата — в sali-vpn.apk.cert-sha256.txt).
          prerelease: true
          files: |
            sali-vpn.apk
            sali-vpn.apk.sha256.txt
            sali-vpn.apk.cert-sha256.txt
