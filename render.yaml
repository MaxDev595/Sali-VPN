# Render Blueprint — the Sali VPN backend as one web service:
# API (NestJS) + main bot + support bot, database on Neon.
# Render → New → Blueprint → pick the Sali-VPN repo. Then fill the values marked "sync: false".
# Step-by-step guide: docs/deploy-render-neon.md
services:
  - type: web
    name: sali-api
    runtime: node
    plan: starter            # paid plan: never sleeps, so the bots stay online
    region: frankfurt        # keep the Neon database in AWS eu-central-1 (Frankfurt) too
    branch: main
    autoDeploy: true
    buildFilter:
      paths:
        - apps/api/**
        - apps/bot/**
        - apps/support-bot/**
        - packages/types/**
        - scripts/render-start.js
        - render.yaml
        - package-lock.json
    buildCommand: >-
      npm ci --include=dev --no-audit --no-fund
      --workspace=packages/types --workspace=apps/api --workspace=apps/bot --workspace=apps/support-bot
      && npm run build --workspace=packages/types
      && npm run prisma:generate --workspace=apps/api
      && npm run build --workspace=apps/api --workspace=apps/bot --workspace=apps/support-bot
    startCommand: node scripts/render-start.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TZ
        value: UTC

      # Neon → Connection string, the DIRECT one (not "Pooled"), it ends with ?sslmode=require
      - key: DATABASE_URL
        sync: false

      # Generated by Render once, keep them secret
      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_API_KEY
        generateValue: true
      # Encrypts client VPN keys at rest. Used for nothing else. NEVER change it once set:
      # stored keys can't be decrypted without it.
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d

      # Telegram
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        value: SaliVPNOfficialBot
      - key: SUPPORT_BOT_TOKEN
        sync: false
      - key: SUPPORT_ADMIN_USERNAME
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: SITE_URL
        value: https://salivpn.com
      - key: SUPPORT_URL
        value: https://t.me/SaliVPNHelpBot
      - key: DOWNLOAD_PAGE_URL
        value: https://salivpn.com/download
      - key: APK_DOWNLOAD_URL
        value: https://github.com/MaxDev595/Sali-VPN/releases/download/apk-latest/sali-vpn.apk
      - key: WINDOWS_DOWNLOAD_URL
        value: https://github.com/MaxDev595/Sali-VPN/releases/download/desktop-latest/SaliVPN-Setup.exe

      # Who may call the API from a browser (the site)
      - key: CORS_ORIGINS
        value: https://salivpn.com,https://www.salivpn.com

      # Tariffs
      - key: TRIAL_DURATION_HOURS
        value: "24"
      - key: BOT_PAYMENT_METHODS
        value: stars            # add ",crypto" once CRYPTO_TON_RECEIVE_ADDRESS is set
      - key: STARS_PER_USD
        value: "50"
      - key: CRYPTO_TON_RECEIVE_ADDRESS
        sync: false
      - key: TONAPI_API_KEY
        sync: false

      # VPN servers. "mock" until a WireGuard VPS is connected; then set
      # VPN_PROVIDER=wireguard plus WIREGUARD_API_URL / WIREGUARD_API_KEY / WIREGUARD_SERVER_PUBLIC_HOST.
      - key: VPN_PROVIDER
        value: mock
