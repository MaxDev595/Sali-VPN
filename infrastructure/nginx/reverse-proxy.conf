# Production reverse proxy — terminates TLS and routes public traffic to the
# internal services. Deploy behind a real certificate (e.g. via certbot /
# Let's Encrypt) — this file assumes certs are already provisioned.
#
# Replace `your-domain.example` and `your-miniapp-domain.example` with your
# real domains, and point DNS A/AAAA records at this host.

server {
    listen 80;
    server_name your-miniapp-domain.example your-domain.example;
    return 301 https://$host$request_uri;
}

# Mini App (static frontend)
server {
    listen 443 ssl http2;
    server_name your-miniapp-domain.example;

    ssl_certificate     /etc/letsencrypt/live/your-miniapp-domain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-miniapp-domain.example/privkey.pem;

    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# API + Bot webhook
server {
    listen 443 ssl http2;
    server_name your-domain.example;

    ssl_certificate     /etc/letsencrypt/live/your-domain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;

    client_max_body_size 5m;

    # Public API for the Mini App — internal-only routes (/api/v1/internal/*)
    # are protected by a shared secret at the application layer, but you may
    # additionally block them here for defense in depth:
    location /api/v1/internal/ {
        deny all;
    }

    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Telegram webhook, only used when TELEGRAM_MODE=webhook
    location /telegram/webhook {
        proxy_pass http://bot:8080/telegram/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
