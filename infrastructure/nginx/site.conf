server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # salivpn.com: landing, /download, /help/*. HTTPS terminates at the
    # reverse proxy in front of this container (reverse-proxy.conf).

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
