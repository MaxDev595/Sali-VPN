server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Telegram Mini Apps are loaded in an iframe over HTTPS in production —
    # termination/HTTPS happens at the reverse proxy in front of this
    # container (see infrastructure/nginx/reverse-proxy.conf).

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Frame-Options "ALLOWALL" always;
    add_header X-Content-Type-Options "nosniff" always;
}
